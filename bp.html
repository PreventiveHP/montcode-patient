<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCiIUVMfCt68zWs6Z5aRcyaMQoAUyAmMRI",
        authDomain: "montcode-sentinel.firebaseapp.com",
        databaseURL: "https://montcode-sentinel-default-rtdb.firebaseio.com",
        projectId: "montcode-sentinel",
        storageBucket: "montcode-sentinel.firebasestorage.app",
        messagingSenderId: "726407164878",
        appId: "1:726407164878:web:551351e1cd856dac78b19f"
    };

    const app = initializeApp(firebaseConfig);
    const db_fire = getDatabase(app);

    // UNIFICACIÓN CRÍTICA: Transmisión directa al canal TACTICAL
    window.transmitToFirebase = async (sys, dia) => {
        // Usamos mc_patient_uuid para que coincida con el botón del Index
        const pId = localStorage.getItem('mc_patient_uuid') || localStorage.getItem('patient_id') || "PX-DEBUG-001";
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        
        statusText.innerText = "TRANSMITTING...";
        statusDot.className = "w-2 h-2 bg-yellow-500 animate-pulse";

        try {
            // RUTA DE SUCCIÓN DIRECTA PARA BP TACTICAL
            const vitalsRef = ref(db_fire, `vitals/${pId}`);
            await push(vitalsRef, { 
                sys: parseInt(sys), 
                dia: parseInt(dia), 
                med: document.getElementById('med-toggle').classList.contains('active'),
                timestamp: Date.now(),
                source: "BP_Master_Direct" 
            });
            
            statusText.innerText = "BRIDGE SYNCED ✅";
            statusDot.className = "w-2 h-2 bg-green-500 shadow-[0_0_8px_#22c55e]";
            setTimeout(() => {
                statusText.innerText = "BRIDGE ACTIVE";
                statusDot.className = "w-2 h-2 bg-blue-500";
            }, 3000);
        } catch (e) {
            statusText.innerText = "LINK ERROR";
            statusDot.className = "w-2 h-2 bg-red-500";
        }
    };

    // Mantenemos el reporte clínico en su ruta original sin afectar glucosa
    window.transmitFullReport = async (historyData) => {
        const pId = localStorage.getItem('mc_patient_uuid') || localStorage.getItem('patient_id') || "PX-DEBUG-001";
        try {
            await set(ref(db_fire, `reportes_clinicos/${pId}/bp`), {
                timestamp: Date.now(),
                avgSys: document.getElementById('sys-val').innerText,
                avgDia: document.getElementById('dia-val').innerText,
                history: historyData.map(h => ({ d: h.d, s: h.sys, di: h.dia, m: h.med }))
            });
        } catch (e) { console.error("Report Transmission Failed", e); }
    };
</script>
